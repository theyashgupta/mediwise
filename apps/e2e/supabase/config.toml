# Local Supabase for the e2e suite only. It lives here, not in the repo's supabase folder, so `supabase config push` never sees it.
project_id = "mediwise-e2e"

[db]
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174/**"]

[auth.email]
enable_confirmations = false

[storage.buckets.reports]
public = false
