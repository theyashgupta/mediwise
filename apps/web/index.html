<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediWise</title>
    <meta
      name="description"
      content="Upload a lab report. MediWise explains, scores and tracks each marker."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MediWise" />
    <meta property="og:title" content="MediWise" />
    <meta
      property="og:description"
      content="Upload a lab report. MediWise explains, scores and tracks each marker."
    />
    <meta property="og:url" content="https://mediwise.pages.dev/" />
    <meta property="og:image" content="https://mediwise.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The MediWise logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediWise" />
    <meta
      name="twitter:description"
      content="Upload a lab report. MediWise explains, scores and tracks each marker."
    />
    <meta name="twitter:image" content="https://mediwise.pages.dev/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Instrument+Serif&family=JetBrains+Mono:wght@400..600&display=swap"
    />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      if (navigator.deviceMemory < 4) document.documentElement.dataset.glass = "off";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
