<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Confirm your email address</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #fbfaf7">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #fbfaf7"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px"
          >
            <tr>
              <td style="padding: 0 0 24px 0">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="vertical-align: middle">
                      <img
                        src="https://app.mediwise.theyashgupta.me/icon-192.png"
                        width="32"
                        height="32"
                        alt=""
                        style="display: block; border: 0; border-radius: 8px"
                      />
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        padding-left: 10px;
                        font-family:
                          -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
                          Helvetica, Arial, sans-serif;
                        font-size: 20px;
                        line-height: 28px;
                        font-weight: 600;
                        letter-spacing: -0.01em;
                        color: #201c19;
                      "
                    >
                      MediWise
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 32px;
                  background-color: #fffefd;
                  border: 1px solid #e0ddda;
                  border-radius: 12px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica,
                    Arial, sans-serif;
                  color: #201c19;
                "
              >
                <h1
                  style="margin: 0 0 16px 0; font-size: 22px; line-height: 28px; font-weight: 600"
                >
                  Confirm your email address
                </h1>
                <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px">
                  You made a MediWise account with this email address. Click the button to confirm
                  the address.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="border-radius: 8px; background-color: #176b6b">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-family:
                            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
                            Helvetica, Arial, sans-serif;
                          font-size: 16px;
                          line-height: 24px;
                          font-weight: 600;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 8px;
                        "
                        >Confirm email address</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0 0; font-size: 14px; line-height: 20px; color: #68625e">
                  The link expires after 1 hour. You can use it one time.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 8px 0 8px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica,
                    Arial, sans-serif;
                  font-size: 13px;
                  line-height: 20px;
                  color: #68625e;
                "
              >
                If you did not make a MediWise account, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
