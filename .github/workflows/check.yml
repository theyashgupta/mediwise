name: check

on:
  push:
  pull_request:
  # The deploy workflows call this one, so a deploy runs only after the unit and e2e jobs pass.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Prints the coverage summary of every package and fails when one drops below its threshold.
      - run: pnpm coverage
      # Builds web and landing, and fails when a chunk grows over 10% against scripts/bundle-size.json.
      - run: pnpm size

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_CLI_VERSION: 2.120.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - id: supabase-cli
        uses: actions/cache@v6
        with:
          path: ~/.supabase-cli
          key: supabase-cli-${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.supabase-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.supabase-cli
          curl --fail --silent --show-error --location "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" | tar -xz -C ~/.supabase-cli
      - run: echo "$HOME/.supabase-cli" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # The suite never calls Claude: the API runs with CLAUDE_STUB=true and no ANTHROPIC_API_KEY.
      - run: supabase start --workdir apps/e2e
      # The db tests run in their own database on the same local Supabase, never in the check job.
      - run: pnpm test:db
      - run: pnpm --filter @mediwise/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14

